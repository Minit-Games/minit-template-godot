[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Nothing here belongs in the pack: the tooling, the shell (the exporter inlines
; it into index.html itself), previous builds, docs, and the font licence, which
; ships as THIRD-PARTY-NOTICES.txt at the ZIP root instead.
exclude_filter="tools/*, web/*, build/*, dist/*, .cache/*, *.md, assets/fonts/*.txt"
export_path="dist/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; Minit requirement: single-threaded. A threaded build needs COOP/COEP
; cross-origin isolation headers, which the Minit host does not send -- with
; threads on, the game simply fails to boot in the app.
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=true
; Carries BOTH audio fixes: the AudioWorklet fallback for the app's custom URL
; scheme, and the recovery for the host's mute gain. See web/shell.html.
html/custom_html_shell="res://web/shell.html"
html/head_include=""
; Adaptive (2): the canvas backing store follows the host frame at whatever size
; and aspect it is given.
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
; Games run embedded in the Minit host, never installed standalone.
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
